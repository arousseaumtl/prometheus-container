global
  log stdout format raw local0
  maxconn 1024

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5000ms
  timeout client 5000ms
  timeout server 5000ms

frontend http-in
  bind *:80
  use_backend grafana_backend if { path /grafana } or { path_beg /grafana/ }
  use_backend blackbox_backend if { path /blackbox } or { path_beg /blackbox/ }
  use_backend alertmanager_backend if { path /alertmanager } or { path_beg /alertmanager/ }
  use_backend prometheus_backend if { path /prometheus } or { path_beg /prometheus/ }

backend grafana_backend
  server grafana grafana:3000
  http-request set-path %[path,regsub(^/grafana/?,/)]

backend blackbox_backend
  http-request set-path %[path,regsub(^/blackbox/?,/)]
  server blackbox blackbox-exporter:9115

backend alertmanager_backend
  server alertmanager alertmanager:9093
  http-request set-path %[path,regsub(^/alertmanager/?,/)]

backend prometheus_backend
  server prometheus prometheus:9090
  http-request set-path %[path,regsub(^/prometheus/?,/)]
