groups:
- name: URLDown
  rules:
  - alert: URLDown
    expr: probe_success == 0
    for: 1h
    labels:
      severity: critical
      url: "{{ $labels.url }}"
    annotations:
      summary: "No response from URL"
      description: "No response at URL for more than 1 hour."

- name: HighLatency
  rules:
  - alert: HighLatency
    expr: avg_over_time(probe_duration_seconds[10m]) > 5
    for: 10m
    labels:
      severity: warning
      url: "{{ $labels.url }}"
    annotations:
      summary: "Higher than normal latency"
      description: "The latency in response from URL is above 5 seconds for over 10 minutes."

- name: Watchdog
  rules:
  - alert: Watchdog
    expr: vector(1)
    labels:
      severity: info
    annotations:
      summary: "Continuous watchdog alert"
      description: "This is to signify that the alerting pipeline is functioning correctly."
