global
  log stdout format raw local0
  maxconn 4096

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5000ms
  timeout client 5000ms
  timeout server 5000ms

http-errors custom
    errorfile 404 /etc/haproxy/errors/404.http
    errorfile 503 /etc/haproxy/errors/404.http

frontend http-in
  bind *:80
  acl is_grafana_path path_beg /grafana
  acl is_prometheus_path path_beg /prometheus
  acl is_alertmanager_path path_beg /alertmanager
  acl is_blackbox_path path_beg /blackbox
  acl is_fluentd_path path_beg /logs

  http-request redirect location http://%[hdr(host),field(1,:)]:3000 if is_grafana_path
  http-request redirect location http://%[hdr(host),field(1,:)]:9090 if is_prometheus_path
  http-request redirect location http://%[hdr(host),field(1,:)]:9093 if is_alertmanager_path
  http-request redirect location http://%[hdr(host),field(1,:)]:9115 if is_blackbox_path
  http-request redirect location http://%[hdr(host),field(1,:)]:9880 if is_fluentd_path

  errorfiles custom
  http-response return status 404 default-errorfiles if { status 404 }
