services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    command:
     - "--config.file=/etc/prometheus/prometheus.yml"
     - "--storage.tsdb.retention.time=180d"
     - "--storage.tsdb.retention.size=50GB"
     - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/rules.yml:/etc/prometheus/rules.yml
      - ./config/prometheus/blackbox_targets.json:/etc/prometheus/blackbox_targets.json
      - ./data/prometheus:/prometheus:z
    ports:
      - "9090:9090"
    networks:
      - internal

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./template/alertmanager:/etc/alertmanager/template
      - ./data/alertmanager:/alertmanager:z
    ports:
      - "9093:9093"
    networks:
      - internal

  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    restart: always
    volumes:
      - ./config/blackbox_exporter/blackbox.yml:/etc/blackbox_exporter/config.yml
    depends_on:
      - prometheus
    ports:
      - "9115:9115"
    networks:
      - internal

  prometheus_msteams:
    image: quay.io/prometheusmsteams/prometheus-msteams
    container_name: prometheus_msteams
    restart: always
    volumes:
      - ./template/prometheus_msteams/teams.tmpl:/tmp/teams.tmpl
    env_file:
      - ./env/prometheus_msteams.env
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    volumes:
      - ./data/grafana:/var/lib/grafana:z
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./config/grafana/grafana_datasource_prometheus.yml:/etc/grafana/provisioning/datasources/datasource.yml:z
      - ./config/grafana/grafana_dashboard_provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:z
      - ./config/grafana/grafana_dashboard_blackbox.json:/etc/grafana/provisioning/dashboards/blackbox.json:z
    depends_on:
      - prometheus
    env_file:
      - ./env/grafana.env
    ports:
      - "3000:3000"
    networks:
      - internal

  haproxy:
    image: haproxy:latest
    container_name: haproxy
    restart: always
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
      - ./config/haproxy/404.http:/etc/haproxy/errors/404.http
    depends_on:
      - prometheus
      - blackbox_exporter
      - alertmanager
      - grafana
    networks:
      - internal
    ports:
      - "80:80"

networks:
  internal:
    driver: bridge
